#!/usr/bin/env python3
""" generate_readme.py Generate or update README.md using environment variables and (optionally) GitHub API tokens.
"""

from __future__ import annotations
import os
import sys
import traceback
from datetime import datetime

def get_env(name: str, fallback: str | None = None) -> str | None:
    val = os.getenv(name)
    if val:
        return val
    return fallback

def generate_readme(username: str) -> str:
    now = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
    content = [
        f"# Project README",
        "",
        f"Generated by: **{username}**",
        "",
        f"_Last updated: {now}_",
        "",
        "This README was generated automatically by `.github/workflows/update-readme.yml`.",
        "",
        "## About",
        "Add your project description here.",
        "",
    ]
    return "\n".join(content) + "\n"

def main() -> int:
    # Prefer GH_USERNAME, fall back to GITHUB_ACTOR or GITHUB_REPOSITORY_OWNER
    gh_username = get_env("GH_USERNAME", None)
    if not gh_username:
        gh_username = get_env("GITHUB_ACTOR", None) or get_env("GITHUB_REPOSITORY_OWNER", None)

    if not gh_username:
        # If you want the workflow to abort early, raise. Otherwise you can set a default.
        raise SystemExit("GH_USERNAME (or GITHUB_ACTOR / GITHUB_REPOSITORY_OWNER) environment variable is required")

    try:
        readme_text = generate_readme(gh_username)

        # Write README.md (relative to repo root in GitHub Actions)
        out_path = os.path.join(os.getcwd(), "README.md")
        with open(out_path, "w", encoding="utf-8") as f:
            f.write(readme_text)

        print(f"README.md written to {out_path}")
        return 0
    except Exception as e:
        # Print full traceback for CI logs and fail
        traceback.print_exc()
        print(f"Error: {e}", file=sys.stderr)
        return 2

if __name__ == "__main__":
    sys.exit(main())
